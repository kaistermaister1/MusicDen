<!DOCTYPE html>
<html lang="en" style="background:#101012">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co http://127.0.0.1:*">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#17181b">
<link rel="manifest" href="../app.webmanifest">
<link rel="apple-touch-icon" href="../../assets/icon-192.png">
<title></title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../welcome.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button class="tb" id="libBtn" type="button" aria-controls="lib"></button>
    <div class="piece"><span class="piece-title" id="title"></span></div>
    <div class="transport">
      <button class="ib" id="play" type="button"></button>
      <button class="ib" id="restart" type="button"></button>
      <span class="time" id="tcur">0:00</span>
      <div class="ov" id="ov" role="slider" tabindex="0" aria-valuemin="0"><canvas id="ovc"></canvas></div>
      <span class="time total" id="tdur">0:00</span>
    </div>
    <div class="side">
      <label class="mini"><span id="speedLab"></span><select id="speed"></select></label>
      <label class="mini vol"><span id="volLab"></span><input id="vol" type="range" min="0" max="1" step="0.01"></label>
      <button class="tb ic" id="sheetBtn" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="ln" d="M6 12V3.5l7-1.5v8.5"/><ellipse class="ln" cx="4.2" cy="12" rx="1.8" ry="1.4"/><ellipse class="ln" cx="11.2" cy="10.5" rx="1.8" ry="1.4"/></svg><span class="lbl"></span></button>
      <button class="tb ic" id="undoBtn" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="ln" d="M6 3 2.5 6.5 6 10M3 6.5h6.5a3.5 3.5 0 0 1 0 7H7"/></svg><span class="lbl"></span></button>
      <button class="tb ic" id="editBtn" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="ln" d="M2.5 13.5l.8-3.2 7.6-7.6 2.4 2.4-7.6 7.6zM9.6 4l2.4 2.4"/></svg><span class="lbl"></span></button>
      <button class="tb ic" id="setBtn" type="button" aria-controls="insp" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="ln" d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle class="ln" cx="10.5" cy="4.5" r="1.5"/><circle class="ln" cx="5.5" cy="11.5" r="1.5"/></svg><span class="lbl"></span></button>
    </div>
  </header>
  <aside class="lib" id="lib">
    <div class="lib-head"><h2 id="libTitle"></h2></div>
    <ul class="songs" id="songs" aria-labelledby="libTitle"></ul>
    <form class="lib-link pc" id="link" novalidate>
      <input id="linkUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false">
      <button class="tb" id="linkGo" type="submit"></button>
    </form>
    <div class="lib-file pc">
      <button class="tb" id="fileBtn" type="button"></button>
    </div>
    <p class="lib-job pc" id="job" role="status"></p>
    <div class="acct" id="acct"></div>
  </aside>
  <main class="stage" id="stage">
    <canvas id="tab"></canvas>
    <canvas id="sheet" class="sheet"></canvas>
    <p class="blank" id="blank"></p>
    <div class="msg" id="msg" role="status"></div>
    <p class="hint" id="hint"></p>
  </main>
  <aside class="insp" id="insp"></aside>
</div>
<script type="module" src="arrival.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
